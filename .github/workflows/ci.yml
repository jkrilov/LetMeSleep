name: Build and security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build, tests, and dependency audit
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore and audit direct and transitive dependencies
        run: dotnet restore .\tests\LetMeSleep.Tests\LetMeSleep.Tests.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low -warnaserror

      - name: Build with warnings as errors
        run: dotnet build .\tests\LetMeSleep.Tests\LetMeSleep.Tests.csproj --configuration Release --no-restore -warnaserror

      - name: Run regression and native UI tests
        run: dotnet run --project .\tests\LetMeSleep.Tests\LetMeSleep.Tests.csproj --configuration Release --no-build --no-restore

  codeql:
    name: CodeQL security analysis
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Build app for analysis
        run: dotnet build .\src\LetMeSleep\LetMeSleep.csproj --configuration Release -warnaserror

      - name: Analyze security findings
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          category: /language:csharp

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
